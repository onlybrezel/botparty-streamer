name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build + Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-matrix:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
          - goos: linux
            goarch: arm64
            goarm: ""
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
            goarm: ""
          - goos: darwin
            goarch: arm64
            goarm: ""
          - goos: windows
            goarch: amd64
            goarm: ""
          - goos: windows
            goarch: arm64
            goarm: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-X main.version=${{ github.ref_name }}" -o /tmp/botparty-streamer ./cmd/botparty-streamer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}

  token-backend-example:
    name: Token backend example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/token-backend-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/token-backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check server.js

      - name: Audit dependencies
        run: npm audit --audit-level=high
