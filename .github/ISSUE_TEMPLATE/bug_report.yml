name: Bug report
description: Report a reproducible problem with botparty-streamer
title: ""
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Output of botparty-streamer --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Operating system, architecture and ffmpeg version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, secrets and private hostnames before posting.
      render: text
